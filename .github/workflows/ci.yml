name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  # Nothing is running here, on purpose. Every area whose service is absent has to
  # report that it is skipping and let the app boot anyway, so the service-free run
  # is the one that proves the contract.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run lint:check
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run test:cov

      - name: Boot the app and probe it
        env:
          API_PORT: 3001
          SQLITE_DB_PATH: ./.tmp/ci.db
          STORAGE_LOCAL_ROOT: ./.tmp/ci-uploads
        run: |
          bun src/main.ts &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/service/up > /dev/null && break
            sleep 1
          done
          # `status` is ok even though the cache and the queue are degraded: an
          # absent service is reported, never a failed readiness probe.
          curl -fsS http://127.0.0.1:3001/api/service/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3001/api/service/health | grep -q '"degraded":{"cache"'
          curl -fsS http://127.0.0.1:3001/api/openapi.json > /dev/null
          # Better Auth's own endpoints are in the document, contributed rather
          # than discovered.
          curl -fsS http://127.0.0.1:3001/api/openapi.json | grep -q '/api/auth/sign-in/email'
          kill "$pid"

      - name: End-to-end suite against a live server
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # The same suites with the services up, which is what exercises the real cache,
  # the real broker, a worker consuming in a second process and the rate limiter
  # actually counting. Neither job may fail.
  with-services:
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run test:e2e

      - name: The worker consumes what the app publishes
        env:
          API_PORT: 3002
          SQLITE_DB_PATH: ./.tmp/queue.db
          STORAGE_LOCAL_ROOT: ./.tmp/queue-uploads
          QUEUE_PREFIX: ci-${{ github.run_id }}
        run: |
          bun src/main.ts &
          app=$!
          bun src/worker.ts &
          worker=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3002/api/service/up > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3002/api/service/health | tee /dev/stderr | grep -q '"queue":{"status":"up"'
          kill "$app" "$worker"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t dunx-template:ci .
      - name: Boot the container and probe it
        run: |
          # The image is `APP_ENV=prod`, and production refuses the development auth
          # secret, so an image with no `BETTER_AUTH_SECRET` is meant to fail to boot.
          docker run -d --name dunx-template-ci -p 3001:3001 \
            -e BETTER_AUTH_SECRET=ci-secret-that-is-at-least-32-characters \
            dunx-template:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/service/up > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/api/service/health | grep -q '"status":"ok"'
          docker logs dunx-template-ci
          docker rm -f dunx-template-ci
      - name: A production image with no auth secret refuses to boot
        run: |
          if docker run --rm dunx-template:ci 2>&1 | grep -q 'BETTER_AUTH_SECRET is required'; then
            echo "refused, as intended"
          else
            echo "the image booted without a session secret" >&2
            exit 1
          fi
