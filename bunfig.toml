# The one line that makes constructor injection work. @dunx/transform records each
# class's constructor parameter types at load time so the container can resolve
# them. Without it, boot fails naming the provider it could not build.
preload = ["@dunx/transform/preload"]

[test]
root = "./src"
preload = ["@dunx/transform/preload"]
coverageDir = "coverage"
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true

[test.reporter]
junit = "coverage/test-results.xml"
