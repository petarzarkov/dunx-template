# The backing services, on their own so the app can be run from source against
# them: `docker compose -f docker-compose.services.yml up -d`, then `bun run dev`.
#
# **Needing this file is never a requirement.** Every area it starts degrades on
# its own: with no Redis the cache reports itself degraded, the throttler stops
# counting, the queue routes answer 503 and websocket fan-out stays local to the
# process; with no bucket the local disk backend is the default. `bun run start`,
# `bun test` and `bun run test:e2e` all pass with none of this running.
services:
  redis:
    # Valkey rather than Redis: `Bun.RedisClient` speaks the same protocol, the
    # licence is unambiguous, and `valkey://` is the first URL Bun's own default
    # chain looks for.
    image: valkey/valkey:8-alpine
    container_name: dunx-template-valkey
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # S3, locally. Set STORAGE_DRIVER=s3 and the five S3_* variables in .env to
  # exercise `Bun.S3Client` instead of `Bun.file`, with no code change - the
  # backend is one `StorageOptions` subclass.
  minio:
    image: minio/minio:latest
    container_name: dunx-template-minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: dunx
      MINIO_ROOT_PASSWORD: dunx-secret
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 3s
      retries: 5

  # Creates the bucket once and exits, so `up` is enough to have somewhere to put
  # an object.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 dunx dunx-secret &&
      mc mb --ignore-existing local/dunx-template &&
      echo 'bucket ready'
      "

volumes:
  minio-data:
