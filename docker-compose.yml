# The app on its own, with nothing behind it, because that has to work: the cache,
# the queue and the websocket relay all report themselves degraded rather than
# refusing to start. Bring the services up alongside with
# `docker compose -f docker-compose.yml -f docker-compose.services.yml up`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-local}
        COMMIT_MESSAGE: ${COMMIT_MESSAGE:-local build}
    container_name: dunx-template
    restart: unless-stopped
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      API_PORT: 3001
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SQLITE_DB_PATH: /app/data/app.db
      STORAGE_LOCAL_ROOT: /app/data/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      TRUST_PROXY: 'true'
      # Unset by default. Point it at the services compose file's valkey to turn
      # the degraded areas live: `REDIS_URL=redis://redis:6379 docker compose ...`
      REDIS_URL: ${REDIS_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/api/service/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # The consumer. A second process on purpose: it builds only what a handler needs,
  # has no HTTP server, and shares exactly one thing with the app - the module list.
  # Scale it independently with `docker compose up --scale worker=3`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ['bun', 'src/worker.ts']
    environment:
      APP_ENV: ${APP_ENV:-local}
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SQLITE_DB_PATH: /app/data/app.db
      STORAGE_LOCAL_ROOT: /app/data/uploads
      # A worker with no broker has nothing to do, so unlike the app it exits
      # rather than serving degraded.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - app-data:/app/data
    profiles: ['worker']

volumes:
  app-data:
