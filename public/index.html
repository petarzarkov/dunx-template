<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dunx template - realtime</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e9ef;
        --muted: #949cad;
        --accent: #6ea8fe;
        --ok: #5ddba4;
        --bad: #ff7b72;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: 0 auto;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      h1 {
        font-size: 20px;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 16px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0e1117;
        color: var(--text);
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }
      button {
        padding: 9px 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #0b1020;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        border-color: var(--line);
        color: var(--text);
        font-weight: 500;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .row > div {
        flex: 1 1 180px;
      }
      .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--bad);
        margin-right: 6px;
        vertical-align: middle;
      }
      .dot.on {
        background: var(--ok);
      }
      #rooms {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .tag {
        font-size: 12px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
      }
      #log {
        height: 340px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }
      .msg {
        border-left: 2px solid var(--line);
        padding-left: 10px;
      }
      .msg .who {
        color: var(--accent);
        font-weight: 600;
      }
      .msg.sys {
        border-left-color: var(--muted);
        color: var(--muted);
        font-style: italic;
      }
      .msg.note {
        border-left-color: var(--ok);
      }
      .msg .at {
        color: var(--muted);
        font-size: 11px;
        margin-left: 6px;
      }
      .err {
        color: var(--bad);
        min-height: 18px;
        font-size: 13px;
      }
      a {
        color: var(--accent);
      }
      footer {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>dunx template</h1>
        <span><span id="dot" class="dot"></span><span id="state">offline</span></span>
      </header>
      <p class="sub">
        One <code>Bun.serve</code> answers the REST routes and this socket. No
        socket.io, no adapter, no second port.
      </p>

      <section id="auth" class="panel">
        <div class="row">
          <div>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" value="admin@example.com" />
          </div>
          <div>
            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" />
          </div>
          <button id="signin">Sign in</button>
          <button id="signup" class="ghost">Register</button>
        </div>
        <p id="authErr" class="err"></p>
      </section>

      <section id="chat" class="panel" hidden>
        <div id="log"></div>
        <form id="send" class="row">
          <div><input id="text" placeholder="Say something" autocomplete="off" maxlength="1000" /></div>
          <button type="submit">Send</button>
          <button type="button" id="out" class="ghost">Sign out</button>
        </form>
        <div id="rooms"></div>
      </section>

      <footer>
        <a href="/api/docs">Swagger</a> &middot;
        <a href="/api/public">Scalar</a> &middot;
        <a href="/api/service/health">Health</a>
      </footer>
    </main>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const api = (p) => `/api${p}`;
      let socket = null;

      const line = (html, cls = '') => {
        const el = document.createElement('div');
        el.className = `msg ${cls}`;
        el.innerHTML = html;
        $('log').append(el);
        $('log').scrollTop = $('log').scrollHeight;
      };

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );

      const now = () => new Date().toLocaleTimeString();

      const setState = (on, label) => {
        $('dot').classList.toggle('on', on);
        $('state').textContent = label;
      };

      /**
       * The envelope is `{"event":..,"data":..}`, which is the whole wire
       * protocol. `@OnMessage('chatMessage')` on the gateway receives `data`
       * decoded, and replies under the same event name.
       */
      const connect = () => {
        const url = new URL('/ws', location.href);
        url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        socket = new WebSocket(url);

        socket.onopen = () => setState(true, 'connected');
        socket.onclose = (e) => {
          setState(false, `closed (${e.code})`);
          socket = null;
        };
        // An upgrade refused by `@OnUpgrade` never becomes a socket, so an
        // unauthenticated attempt arrives here rather than as a 401 body.
        socket.onerror = () => setState(false, 'refused');

        socket.onmessage = (ev) => {
          let frame;
          try {
            frame = JSON.parse(ev.data);
          } catch {
            return;
          }
          const { event, data } = frame;
          if (event === 'connected') {
            line(`connected as <span class="who">${esc(data.email)}</span>`, 'sys');
            $('rooms').innerHTML = data.rooms
              .map((r) => `<span class="tag">${esc(r)}</span>`)
              .join('');
            return;
          }
          if (event === 'message') {
            line(
              `<span class="who">${esc(data.from)}</span>: ${esc(data.text)}<span class="at">${now()}</span>`,
            );
            return;
          }
          if (event === 'notification') {
            line(`${esc(data.event)} ${esc(JSON.stringify(data.payload))}`, 'note');
            return;
          }
          if (event === 'chatMessage' && data && data.error) {
            line(esc(data.error), 'sys');
            return;
          }
          line(`${esc(event)} ${esc(JSON.stringify(data))}`, 'sys');
        };
      };

      const enter = () => {
        $('auth').hidden = true;
        $('chat').hidden = false;
        $('text').focus();
        connect();
      };

      const auth = async (path) => {
        $('authErr').textContent = '';
        const body = {
          email: $('email').value,
          password: $('password').value,
        };
        if (path.includes('sign-up')) body.name = body.email.split('@')[0];

        const res = await fetch(api(`/auth${path}`), {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const detail = await res.json().catch(() => ({}));
          $('authErr').textContent = detail.message ?? `failed (${res.status})`;
          return;
        }
        enter();
      };

      $('signin').onclick = () => auth('/sign-in/email');
      $('signup').onclick = () => auth('/sign-up/email');

      $('send').onsubmit = (e) => {
        e.preventDefault();
        const text = $('text').value.trim();
        if (text === '' || socket === null) return;
        socket.send(JSON.stringify({ event: 'chatMessage', data: text }));
        $('text').value = '';
      };

      $('out').onclick = async () => {
        socket?.close();
        await fetch(api('/auth/sign-out'), { method: 'POST' });
        $('chat').hidden = true;
        $('auth').hidden = false;
        $('log').innerHTML = '';
        $('rooms').innerHTML = '';
        setState(false, 'offline');
      };

      // A live session means the upgrade will be accepted, so skip the form.
      const me = await fetch(api('/profile'), { headers: { accept: 'application/json' } });
      if (me.ok) enter();
    </script>
  </body>
</html>
