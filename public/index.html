<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dunx template - realtime</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>dunx template</h1>
        <span
          ><span id="dot" class="dot"></span
          ><span id="state">offline</span></span
        >
      </header>
      <p class="sub">
        One <code>Bun.serve</code> answers the REST routes and this socket. No
        socket.io, no adapter, no second port.
      </p>

      <section id="auth" class="panel">
        <div class="row">
          <div>
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              autocomplete="username"
              value="admin@example.com"
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
            />
          </div>
          <button id="signin">Sign in</button>
          <button id="signup" class="ghost">Register</button>
        </div>
        <p id="authErr" class="err"></p>
      </section>

      <section id="chat" class="panel" hidden>
        <div id="log"></div>
        <form id="send" class="row">
          <div>
            <input
              id="text"
              placeholder="Say something"
              autocomplete="off"
              maxlength="1000"
            />
          </div>
          <button type="submit">Send</button>
          <button type="button" id="out" class="ghost">Sign out</button>
        </form>
        <div id="rooms"></div>
      </section>

      <footer>
        <a href="/api/docs">Swagger</a> &middot;
        <a href="/api/public">Scalar</a> &middot;
        <a href="/api/health/ready">Health</a>
      </footer>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
